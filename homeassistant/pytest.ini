[pytest]
# pytest-homeassistant-custom-component needs this: every test in it is a coroutine, and without
# auto mode each one has to be decorated individually.
asyncio_mode = auto
testpaths = tests
# custom_components lives at the repository root, which is where both Home Assistant and
# HACS expect to find it, so that is what has to be importable.
pythonpath = ..
