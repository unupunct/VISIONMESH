name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.component }} ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        component: [server, agent]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set the version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: |
          if [ "${{ matrix.component }}" = "server" ]; then
            PROJECT=server/VisionMesh.Server
          else
            PROJECT=agents/linux/VisionMesh.Agent.Linux
          fi

          dotnet publish "$PROJECT" \
            -c Release \
            -r linux-${{ matrix.arch }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version=${{ steps.version.outputs.value }} \
            -o out

      - name: Package
        run: |
          cp LICENSE out/ 2>/dev/null || true

          if [ "${{ matrix.component }}" = "server" ]; then
            cp README.md INSTALL.md out/ 2>/dev/null || true
            cp -r docs out/docs 2>/dev/null || true
            NAME="VisionMesh-Server-Linux-${{ matrix.arch }}"
          else
            # A predictable command name, so the documentation can name one thing.
            mv out/VisionMesh.Agent.Linux out/visionmesh-agent
            chmod +x out/visionmesh-agent
            cp scripts/visionmesh-agent.service out/ 2>/dev/null || true
            NAME="VisionMesh-Agent-Linux-${{ matrix.arch }}"
          fi

          tar -czf "${NAME}.tar.gz" -C out .
          sha256sum "${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: VisionMesh-${{ matrix.component }}-Linux-${{ matrix.arch }}
          path: '*.tar.gz'
          retention-days: 14
